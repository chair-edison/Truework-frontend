<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오프라인 · Truework</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5F7FA; color: #202630;
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  .card { background: #fff; border: 1px solid #DCE1E7; border-radius: 12px; padding: 32px 24px; margin: 20px; max-width: 340px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: #626D7C; font-size: 15px; line-height: 1.6; margin: 0 0 24px; }
  button { min-height: 48px; width: 100%; border: 0; border-radius: 10px; background: #FFA73D; color: #202630; font: inherit; font-weight: 700; font-size: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결을 확인한 뒤 다시 시도해 주세요. 입력하던 내용은 기기에 남아 있어요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
